name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
    inputs:
      run_eval:
        description: "Run the LangSmith golden-set eval (requires OPENAI_API_KEY + LANGSMITH_API_KEY secrets)"
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: |
          python -m ruff check .
          python -m ruff format --check .
      - name: Unit tests (no integration or LangSmith eval)
        run: python -m pytest tests/ -v -m "not integration and not langsmith_eval" --cov=src --cov-report=term-missing

  docker-build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Skip the injection-model bake for CI speed; this validates the build only.
      - name: Build image
        run: docker build --build-arg INSTALL_INJECTION_MODEL=false -t eac-copilot:ci .

  # Manual-only: never runs on push/PR. Trigger via Actions -> CI -> "Run workflow"
  # with run_eval checked, after configuring OPENAI_API_KEY and LANGSMITH_API_KEY
  # as repo secrets. Runs the quick-mode eval (deterministic evaluators, 2 examples
  # per category) and uploads the cost/latency/score report as an artifact.
  langsmith-eval:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' && inputs.run_eval
    env:
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      LANGSMITH_API_KEY: ${{ secrets.LANGSMITH_API_KEY }}
      LANGSMITH_TRACING: "true"
      LANGSMITH_PROJECT: enterprise-arch-copilot-eval
      GITHUB_SHA: ${{ github.sha }}
      EAC_EVAL_QUICK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Bootstrap data (mock data + vector DB)
        run: python -m scripts.setup
      - name: LangSmith evaluate (golden set, quick mode)
        run: |
          if [ -z "$OPENAI_API_KEY" ] || [ -z "$LANGSMITH_API_KEY" ]; then
            echo "OPENAI_API_KEY or LANGSMITH_API_KEY secrets not configured; nothing to do."
            exit 1
          fi
          python -m pytest tests/eval/ -v -m langsmith_eval
      - name: Upload eval report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: eval_reports/
          if-no-files-found: ignore

[project]
name = "enterprise-arch-copilot"
version = "0.1.0"
description = "Multi-agent RAG incident copilot for a fictional payments SaaS (LangGraph, ChromaDB, SQLite)"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# requirements.txt stays the single pinned source of truth; pyproject reads it so
# `pip install .` and LangGraph Platform (langgraph.json -> ["."]) install the same set.
[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools]
packages = ["src", "src.api"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["templates/mock_docs"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is handled by `ruff format`; long prompt/docstring literals stay readable as-is.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
ignore_missing_imports = true

[tool.pytest.ini_options]
markers = [
    "integration: tests that require OPENAI_API_KEY and/or a built chroma_db (run after generate_mock_data + build_vector_db)",
    "langsmith_eval: LangSmith evaluate() runs against the copilot (requires OPENAI + LANGSMITH + built chroma_db)",
]

[tool.coverage.run]
source = ["src"]

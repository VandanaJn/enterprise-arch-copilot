# Local container workflow.
#
# First run (no host Python needed):
#   docker compose run --rm setup     # generates data/ (docs, SQLite, chroma)
#   docker compose up                 # serves the API on http://localhost:8000
#
# All generated data lives under ./data on the host (gitignored), mounted at /data.
# The app service mounts it read-only; only the setup service gets write access.
# OPENAI_API_KEY (and optional LangSmith vars) come from .env.

services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      EAC_DB_FILE: /data/engineering_data.db
      EAC_CHROMA_DIR: /data/chroma_db
      EAC_DOCS_DIR: /data/docs
    volumes:
      - ./data:/data:ro

  setup:
    profiles: ["setup"]
    build: .
    env_file: .env
    command: python -m scripts.setup
    environment:
      EAC_DB_FILE: /data/engineering_data.db
      EAC_CHROMA_DIR: /data/chroma_db
      EAC_DOCS_DIR: /data/docs
    volumes:
      - ./data:/data
